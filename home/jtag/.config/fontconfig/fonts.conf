<!--
NOTE: This file contains other configurations also. You should append following configurations to this file instead of replacing it.
-->

<fontconfig>
  <!--
  use Vazirmatn font for Farsi
  -->
  <match>
   <test name="lang" compare="contains">
    <string>fa</string>
    </test>
   <edit name="family" mode="prepend">
     <string>Vazirmatn</string>
     </edit>
   </match>
    <!--
     use Vazirmatn font for Arabic
  -->
   <match>
  <test name="lang" compare="contains">
     <string>ar</string>
   </test>
   <edit name="family" mode="prepend">
    <string>Vazirmatn</string>
    </edit>
  </match>

</fontconfig>
  
